<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<title>资源查看器（pkg 直读）</title>
<style>
:root{--bg:#16181d;--fg:#dfe3ea;--dim:#8b93a3;--acc:#5aa9ff;--line:#2a2e37;--card:#21252d}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.45 "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:#1b1e24}
header b{color:var(--acc);margin-right:6px;font-weight:600}
#cats{display:flex;flex-wrap:wrap;gap:4px;flex:1}
#cats button{background:#242933;color:#cfd6e3;border:1px solid #313846;border-radius:14px;padding:3px 10px;cursor:pointer;font-size:12px}
#cats button:hover{border-color:#4a6b96}
#cats button.on{background:#1d3a5c;border-color:var(--acc);color:#fff}
#kind,#q{background:#141821;border:1px solid #313846;color:var(--fg);border-radius:6px;padding:4px 6px}
#q{width:180px}
main{flex:1;overflow:auto;padding:10px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.card{background:var(--card);border:1px solid #2b313c;border-radius:6px;padding:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-height:104px;justify-content:center}
.card:hover{border-color:var(--acc)}
.card .stage{width:88px;height:88px;display:flex;align-items:center;justify-content:center;border-radius:3px;
 background-color:#2a2f38;
 background-image:linear-gradient(45deg,#3a4049 25%,transparent 25%,transparent 75%,#3a4049 75%),
                  linear-gradient(45deg,#3a4049 25%,transparent 25%,transparent 75%,#3a4049 75%);
 background-size:12px 12px;background-position:0 0,6px 6px}
.card .stage img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;image-rendering:pixelated}
.card img.bad{visibility:hidden}
.card .ico{font-size:30px;line-height:88px;height:88px;width:88px;text-align:center;color:#7f8b9e}
.card .lbl{font-size:11px;color:#a8b2c2;margin-top:3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
footer{display:flex;gap:8px;align-items:center;padding:6px 10px;border-top:1px solid var(--line);background:#1b1e24;color:var(--dim)}
footer button,footer select{background:#242933;color:#cfd6e3;border:1px solid #313846;border-radius:5px;padding:3px 8px;cursor:pointer}
footer input{background:#141821;border:1px solid #313846;color:var(--fg);border-radius:5px;padding:3px 6px;width:70px}
footer button:disabled{opacity:.35;cursor:default}
#pInfo{color:var(--fg);min-width:96px;text-align:center}
#stat{margin-left:auto}
#detail{position:fixed;inset:0;background:#0f1116f2;display:flex;flex-direction:column;z-index:20}
#detail[hidden]{display:none}
#dhead{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
#dtitle{color:var(--acc);font-weight:600}
#dmeta{color:var(--dim);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dclose{background:#332;border:1px solid #644;color:#fbb;border-radius:5px;padding:3px 9px;cursor:pointer}
#dframes{flex:1;overflow:auto;padding:10px}
#dframes.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
#dframes .stage{width:112px;height:112px}
#dframes .stage img{cursor:zoom-in}
pre{background:#11141a;border:1px solid var(--line);border-radius:6px;padding:10px;overflow:auto;margin:0;font:12px/1.5 Consolas,monospace;color:#cdd6e4;max-height:100%}
table{border-collapse:collapse;font-size:12px;font-family:Consolas,monospace}
th,td{border:1px solid #2b313c;padding:2px 6px;white-space:nowrap}
th{background:#242933;color:#cfd6e3;position:sticky;top:0}
#lb{position:fixed;inset:0;background:#000e;display:flex;align-items:center;justify-content:center;z-index:40;cursor:zoom-out}
#lb[hidden]{display:none}
#lbimg{max-width:94vw;max-height:90vh;image-rendering:pixelated;
 background-color:#2a2f38;
 background-image:linear-gradient(45deg,#3a4049 25%,transparent 25%,transparent 75%,#3a4049 75%),
                  linear-gradient(45deg,#3a4049 25%,transparent 25%,transparent 75%,#3a4049 75%);
 background-size:16px 16px;background-position:0 0,8px 8px}
#lbside{display:flex;align-items:flex-start;margin-right:14px}
#lbside[hidden]{display:none}
#lbhint{position:fixed;bottom:8px;left:0;right:0;text-align:center;color:#9fb4d0;font-size:12px;pointer-events:none}
</style></head><body>
<header><b>资源</b><div id="cats"></div>
  <select id="kind"><option value="img" selected>图片</option><option value="all">全部文件</option><option value="bin">表格</option></select>
  <input id="q" placeholder="过滤名字…"></header>
<main><div id="grid"></div></main>
<footer>
  <button id="pFirst">⏮</button><button id="pPrev">◀</button>
  <span id="pInfo">-</span>
  <button id="pNext">▶</button><button id="pLast">⏭</button>
  <select id="pSize"><option selected>100</option><option>200</option><option>500</option><option>1000</option></select>
  <input id="pJump" type="number" min="1" placeholder="页码">
  <button id="pGo">跳转</button>
  <span id="stat"></span>
</footer>
<div id="detail" hidden>
  <div id="dhead"><span id="dtitle"></span><span id="dmeta"></span><button id="dclose">✕ 关闭</button></div>
  <div id="dframes"></div>
</div>
<div id="lb" hidden><div id="lbside" hidden></div><img id="lbimg" alt=""><div id="lbhint">点击任意处关闭</div></div>
<script>
const IMGEXT=new Set(['gsn','gso','gsa','til','dat','tga','bmp','png','jpg','jpeg','eff','map']);
const S={cat:'',page:0,size:100,total:0,pages:1,files:[],kind:'img'};
const $=s=>document.querySelector(s);
const enc=encodeURIComponent;
const ext=n=>n.split('.').pop().toLowerCase();
async function j(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status+' '+u);return r.json()}

let io=null;
function newIO(){
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>{
    es.forEach(e=>{
      if(!e.isIntersecting)return;
      const im=e.target;io.unobserve(im);
      if(im.dataset.src){im.src=im.dataset.src;delete im.dataset.src}
    });
  },{root:document.querySelector('main'),rootMargin:'240px'});
}
function cancelImgs(){
  if(io)io.disconnect();
  document.querySelectorAll('#grid img').forEach(im=>{im.removeAttribute('src');delete im.dataset.src});
}

async function boot(){
  let cats;
  try{cats=await j('/api/cats')}catch(e){$('#stat').textContent='读取分类失败 '+e;return}
  const box=$('#cats');
  const HIDE=new Set(['pet','zipbin']);
  cats.filter(c=>!HIDE.has(c.n)).forEach(c=>{
    const b=document.createElement('button');
    b.textContent=c.n+'  '+c.c;
    b.onclick=()=>{S.cat=c.k;S.page=0;[...box.children].forEach(x=>x.classList.toggle('on',x===b));load()};
    box.appendChild(b);
  });
  box.firstChild && box.firstChild.click();
}

async function load(){
  cancelImgs();
  const u='/api/files?p='+enc(S.cat)+'&kind='+S.kind+'&page='+S.page+'&size='+S.size+'&q='+enc($('#q').value.trim());
  let r;
  try{r=await j(u)}catch(e){$('#stat').textContent='读取失败 '+e;$('#grid').innerHTML='';return}
  S.files=r.files;S.total=r.total;S.pages=r.pages;S.page=r.page;
  render();
}

function render(){
  const g=$('#grid');
  if(io)io.disconnect();
  [...g.querySelectorAll('img')].forEach(im=>{im.removeAttribute('src');delete im.dataset.src});
  g.innerHTML='';
  newIO();
  if(!S.files.length){
    const d=document.createElement('div');
    d.style.cssText='grid-column:1/-1;color:#8b93a3;padding:24px;text-align:center';
    d.textContent='（这个分类在当前模式下没有文件，试试切到「全部文件」）';
    g.appendChild(d);
  }
  S.files.forEach(f=>{
    const p=f.p?(f.p):(S.cat?S.cat+'/'+f.n:f.n);
    const c=document.createElement('div');c.className='card';
    const st=document.createElement('div');st.className='stage';
    if(IMGEXT.has(ext(f.n))){
      const im=document.createElement('img');
      im.dataset.src='/api/img?p='+enc(p)+'&i=0&max=120';
      im.onerror=()=>{c.style.display='none'};
      io.observe(im);
      st.appendChild(im);
    }else{
      st.textContent=ext(f.n)==='bin'?'▦':'📄';
      st.style.fontSize='30px';st.style.color='#7f8b9e';
    }
    c.appendChild(st);
    const lbl=f.t||f.n;
  const l=document.createElement('div');l.className='lbl';l.textContent=lbl;l.title=f.n+'  '+(f.s|0)+' B';
    c.append(l);
    c.onclick=()=>detail(p,f.n);
    g.appendChild(c);
  });
  $('#pInfo').textContent='第 '+(S.page+1)+' / '+S.pages+' 页';
  $('#pJump').max=S.pages;
  $('#pJump').placeholder='1-'+S.pages;
  $('#stat').textContent='共 '+S.total+' 个  ·  '+S.size+'/页';
  $('#pFirst').disabled=$('#pPrev').disabled=S.page<=0;
  $('#pNext').disabled=$('#pLast').disabled=S.page>=S.pages-1;
  g.scrollTop=0;
}

function meta(info){
  const t=[];
  if(info.kind)t.push(info.kind);
  if(info.version)t.push('v'+info.version);
  if(info.width!=null)t.push('行宽 '+info.width);
  if(info.count!=null)t.push(info.count+' 行');
  if(info.frames!=null)t.push(info.frames+' 帧');
  if(info.w!=null)t.push(info.w+'×'+info.h);
  if(info.entries!=null)t.push(info.entries+' 条目');
  if(info.bpp)t.push('bpp '+info.bpp);
  if(info.origin)t.push(info.origin);
  if(info.bytes)t.push((info.bytes/1024).toFixed(1)+' KB');
  return t.join(' · ');
}

/* 详情里的一帧：先只放占位框，点一下才去请求这一帧的图（大图集不会一次拉几百张） */
function mkFrame(p,i){
  const c=document.createElement('div');c.className='card';
  const st=document.createElement('div');st.className='stage';
  const im=document.createElement('img');
  im.loading='lazy';
  const l=document.createElement('div');l.className='lbl';l.textContent='#'+i;
  im.src='/api/img?p='+enc(p)+'&i='+i+'&max=512';
  im.onerror=()=>{im.remove();l.textContent='空帧 '+i};
  im.onclick=()=>lightbox('/api/img?p='+enc(p)+'&i='+i);
  st.appendChild(im);
  c.append(st,l);
  return c;
}

async function detail(p,name){
  $('#detail').hidden=false;
  $('#dtitle').textContent=name;
  $('#dmeta').textContent='加载中…';
  const box=$('#dframes');box.innerHTML='';box.className='';
  try{
    if(ext(name)==='map'){
      await mapDetail(p,name,box);
    }else if(ext(name)==='eff'){
      await effDetail(p,name,box);
    }else if(IMGEXT.has(ext(name))){
      const info=await j('/api/info?p='+enc(p));
      $('#dmeta').textContent=meta(info)+'   '+p;
      box.className='grid';
      const n=info.frames||info.entries||1;
      for(let i=0;i<n;i++) box.appendChild(mkFrame(p,i));
    }else if(ext(name)==='bin'){
      const t=await j('/api/table?p='+enc(p)+'&limit=500');
      $('#dmeta').textContent=meta(t.info)+'   '+p;
      const tb=document.createElement('table');
      const hr=document.createElement('tr');
      t.columns.forEach(c=>{const th=document.createElement('th');th.textContent=c;hr.appendChild(th)});
      tb.appendChild(hr);
      t.rows.forEach(r=>{const tr=document.createElement('tr');r.forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});tb.appendChild(tr)});
      box.appendChild(tb);
    }else{
      const t=await j('/api/text?p='+enc(p)+'&limit=200000');
      $('#dmeta').textContent=meta(t)+'   '+p;
      const pre=document.createElement('pre');pre.textContent=t.text;box.appendChild(pre);
    }
  }catch(e){$('#dmeta').textContent='读取失败 '+e}
}

/* .map：示意图 + 碰撞格 / 怪物 / NPC 叠层 */
async function mapDetail(p,name,box){
  const info=await j('/api/info?p='+enc(p));
  const w=info.world||[0,0], sk=info.sketch||[0,0];
  var fitTxt='';
  if(info.fit){var pc=Math.round((info.fit.inside||0)*100);
    fitTxt='  ·  底图契合 '+pc+'%'+(pc<60?'（建议看「俯视碰撞」）':'');}
  $('#dmeta').textContent=(info.title||info.name||name)+fitTxt+'  ·  世界 '+w[0]+'×'+w[1]
    +'  ·  示意图 '+sk[0]+'×'+sk[1]+'  ·  碰撞格 '+info.cells
    +'  ·  怪物 '+info.monsters+'  ·  NPC '+info.npcs;
  box.className='';
  const bar=document.createElement('div');
  bar.style.cssText='display:flex;gap:14px;align-items:center;margin-bottom:8px;flex-wrap:wrap';
  const mk=(tag,txt,on)=>{const l=document.createElement('label');
    l.style.cssText='display:inline-flex;gap:4px;align-items:center;color:#cfd6e3;cursor:pointer';
    const c=document.createElement(tag);c.checked=on;l.appendChild(c);
    l.appendChild(document.createTextNode(txt));return [l,c];};
  const [l1,cCol]=mk('input','碰撞(红)',true);
  const [l2,cMon]=mk('input','怪物',true);
  const [l3,cNpc]=mk('input','NPC',true);
  const [l4,cMask]=mk('input','俯视碰撞',false);
  const btn=document.createElement('button');
  btn.textContent='刷新';
  btn.style.cssText='background:#242933;color:#cfd6e3;border:1px solid #313846;border-radius:5px;padding:3px 10px;cursor:pointer';
  bar.append(l1,l2,l3,l4,btn);
  box.appendChild(bar);
  const wrap=document.createElement('div');
  wrap.style.cssText='overflow:auto;max-height:78vh;border:1px solid #2a303c;background:#282c34';
  const img=document.createElement('img');
  img.style.cssText='display:block;image-rendering:pixelated';
  img.onclick=()=>{
    const side=document.createElement('div');
    side.style.cssText='min-width:170px;max-width:230px;max-height:90vh;overflow:auto;'
      +'background:#20242c;border:1px solid #313846;border-radius:8px;padding:10px;'
      +'color:#cfd6e3;font-size:12px;cursor:default';
    const h=document.createElement('div');
    h.textContent='怪物列表（'+groups.length+' 种）';
    h.style.cssText='font-weight:600;margin-bottom:8px;color:#e6ebf3';
    side.appendChild(h);
    const list=document.createElement('div');
    list.style.cssText='display:flex;flex-direction:column;gap:6px';
    fillLegend(list);
    side.appendChild(list);
    side.onclick=e=>e.stopPropagation();
    lightbox(img.src,side);
  };
  wrap.appendChild(img);
  box.appendChild(wrap);
  let groups=[];
  try{ const ml=await j('/api/maplist?p='+enc(p)); groups=ml.groups||[]; }catch(e){}
  const legend=document.createElement('div');
  legend.style.cssText='display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 10px;'
    +'color:#cfd6e3;font-size:12px;max-height:96px;overflow:auto';
  const fillLegend=(host)=>{
    host.innerHTML='';
    if(!groups.length){const t=document.createElement('span');
      t.textContent='（这张地图没有刷怪点）';t.style.color='#8b95a5';host.appendChild(t);return;}
    groups.forEach(g=>{
      const it=document.createElement('span');
      it.style.cssText='display:inline-flex;align-items:center;gap:5px';
      const dot=document.createElement('i');
      dot.style.cssText='width:9px;height:9px;border-radius:50%;display:inline-block;'
        +'border:1px solid #0008;background:rgb('+g.color.join(',')+')';
      it.appendChild(dot);
      it.appendChild(document.createTextNode(g.name+' ×'+g.count));
      host.appendChild(it);
    });
  };
  fillLegend(legend);
  box.appendChild(legend);
  const src=()=>cMask.checked?('/api/mapmask?p='+enc(p)+'&w=1400')
    :'/api/mapimg?p='+enc(p)+'&w=1400&col='+(cCol.checked?1:0)
    +'&mon='+(cMon.checked?1:0)+'&npc='+(cNpc.checked?1:0);
  const draw=()=>{img.src=src()};
  btn.onclick=draw;
  cCol.onchange=cMon.onchange=cNpc.onchange=cMask.onchange=draw;
  draw();
}

/* .eff：合成帧 + 「显示文本」开关 */
async function effDetail(p,name,box){
  const info=await j('/api/info?p='+enc(p));
  $('#dmeta').textContent=meta(info)+'   '+p;
  box.className='';
  const bar=document.createElement('div');
  bar.style.cssText='display:flex;gap:10px;align-items:center;margin-bottom:8px';
  const btn=document.createElement('button');
  btn.textContent='显示文本';
  btn.style.cssText='background:#242933;color:#cfd6e3;border:1px solid #313846;border-radius:5px;padding:3px 10px;cursor:pointer';
  bar.appendChild(btn);
  if(info.blank){
    const s=document.createElement('span');
    s.textContent='空特效：所有采样时刻都没有可见像素';
    s.style.color='#f99';
    bar.appendChild(s);
  }
  box.appendChild(bar);
  const pre=document.createElement('pre');
  pre.hidden=true;
  if(!info.blank){
    const grid=document.createElement('div');
    grid.className='grid';
    grid.style.cssText='display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px';
    const n=info.frames||6;
    for(let i=0;i<n;i++) grid.appendChild(mkFrame(p,i));
    box.appendChild(grid);
  }
  box.appendChild(pre);
  btn.onclick=async()=>{
    if(pre.hidden){
      btn.textContent='隐藏文本';
      pre.hidden=false;
      if(!pre.textContent){
        pre.textContent='加载中…';
        try{
          const t=await j('/api/text?p='+enc(p));
          pre.textContent=t.text;
        }catch(e){pre.textContent='读取失败 '+e}
      }
    }else{
      pre.hidden=true;
      btn.textContent='显示文本';
    }
  };
}

function lightbox(src,side){
  const lb=$('#lb');
  $('#lbimg').src=src;
  const box=$('#lbside');
  box.innerHTML='';
  if(side){box.hidden=false;box.appendChild(side);}else{box.hidden=true;}
  lb.hidden=false;
}
function closeLb(){
  $('#lb').hidden=true;
  $('#lbimg').removeAttribute('src');
  const box=$('#lbside');box.hidden=true;box.innerHTML='';
}
$('#lb').onclick=closeLb;

$('#pFirst').onclick=()=>{S.page=0;load()};
$('#pPrev').onclick=()=>{S.page=Math.max(0,S.page-1);load()};
$('#pNext').onclick=()=>{S.page=Math.min(S.pages-1,S.page+1);load()};
$('#pLast').onclick=()=>{S.page=S.pages-1;load()};
$('#pSize').onchange=e=>{S.size=+e.target.value;S.page=0;load()};
function jump(){
  const v=parseInt($('#pJump').value,10);
  if(!v)return;
  S.page=Math.max(0,Math.min(S.pages-1,v-1));
  $('#pJump').value='';
  load();
}
$('#pGo').onclick=jump;
$('#pJump').onkeydown=e=>{if(e.key==='Enter')jump()};
$('#kind').onchange=e=>{S.kind=e.target.value;S.page=0;load()};
$('#dclose').onclick=()=>{ $('#detail').hidden=true; $('#dframes').innerHTML='' };
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(!$('#lb').hidden){closeLb();return}
    if(!$('#detail').hidden){$('#dclose').click();return}
  }
  if(!$('#detail').hidden||!$('#lb').hidden)return;
  if(e.key==='ArrowLeft'&&S.page>0){S.page--;load()}
  if(e.key==='ArrowRight'&&S.page<S.pages-1){S.page++;load()}
});
let t=null;
$('#q').oninput=()=>{clearTimeout(t);t=setTimeout(()=>{S.page=0;load()},250)};
boot();
</script></body></html>
